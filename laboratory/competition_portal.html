<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Amr Torky Institute — Coding Competition & Problem Sandbox</title>
    <style>
        body { margin: 0; font-family: monospace; display: flex; height: 100vh; background: #0d1117; color: #c9d1d9; }
        .pane { width: 50%; padding: 20px; overflow-y: auto; box-sizing: border-box; }
        .left-pane { border-right: 2px solid #30363d; background: #161b22; }
        .right-pane { background: #0d1117; display: flex; flex-direction: column; }
        h1, h2 { color: #58a6ff; }
        .console { flex-grow: 1; background: #010409; border: 1px solid #30363d; padding: 10px; border-radius: 6px; overflow-y: auto; font-size: 13px; color: #7ee787; }
        .control-group { margin-bottom: 15px; }
        select, button { background: #21262d; border: 1px solid #30363d; color: #c9d1d9; padding: 8px 12px; border-radius: 6px; font-family: monospace; cursor: pointer; }
        button:hover { background: #30363d; border-color: #8b949e; }
    </style>
</head>
<body>
    <div class="pane left-pane">
        <h1>🏆 Global Prize Sandbox</h1>
        <p>Attempt to bypass complex matrices from ICPC, QHack, and Kaggle parameters by selecting your compilation execution track below.</p>
        
        <div class="control-group">
            <label for="benchmarkTarget">Select Target Benchmark Matrix:</label><br><br>
            <select id="benchmarkTarget">
                <option value="qhack">QHack 2026: Quantum Matrix Contraction</option>
                <option value="icpc">ICPC World Finals: Combinatorial Tree Routing</option>
                <option value="kaggle">Kaggle: High-Concurrency Gradient Flow</option>
            </select>
        </div>

        <div class="control-group">
            <label for="executionTrack">Select Execution Infrastructure Track:</label><br><br>
            <select id="executionTrack">
                <option value="legacy">Legacy Track (Standard Floating Point - Bounded O(2^N))</option>
                <option value="torky">Torky-Ω Track (Cardano Flow Fixed-Point - Deterministic polynomial)</option>
            </select>
        </div>

        <button onclick="executeSandboxRun()">Submit Code Stream to Sandbox</button>
    </div>

    <div class="pane right-pane">
        <h2>📊 Real-Time Telemetry Monitor</h2>
        <div class="console" id="telemetryConsole">
amr@DESKTOP-9DLG3I0:~/torky_independent_workspace$ Terminal initialized. Awaiting pipeline instruction.
        </div>
    </div>

    <script>
        function appendLog(msg) {
            const consoleNode = document.getElementById('telemetryConsole');
            consoleNode.innerHTML += "<br>" + msg;
            consoleNode.scrollTop = consoleNode.scrollHeight;
        }

        function executeSandboxRun() {
            const matrix = document.getElementById('benchmarkTarget').value.toUpperCase();
            const track = document.getElementById('executionTrack').value;
            
            appendLog(`[INGESTING MATRIX]: Initiating ${matrix} load allocation...`);
            
            if (track === "legacy") {
                appendLog(`  ⚠️ [Telemetry Alert]: Asymptotic search scaling via discrete rules O(2^N).`);
                appendLog(`  ❌ [CRITICAL FATAL]: Matrix condition overflow. Memory wall stall recorded.`);
            } else {
                appendLog(`  ✓ [Verification]: Manifold relaxation deployed via Cardano Closed-Form Trigonometric Root.`);
                appendLog(`  ✓ [Success]: Latency cleared within SLA metrics under 0.8 seconds.`);
            }
        }
    </script>
</body>
</html>
